<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Tools Hub - No Ads - Samran</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f1f5f9}
header{background:#0f172a;color:#fff;padding:15px;display:flex;justify-content:space-between;position:sticky;top:0}
.logo span{color:#38bdf8}
.hero{background:#0f172a;color:#fff;text-align:center;padding:30px 10px}
.grid{max-width:1150px;margin:auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.card{background:#fff;padding:18px;border-radius:14px;border-top:4px solid #0f172a;box-shadow:0 4px 10px rgba(0,0,0,.05)}
.card.yt{border-color:red}.card.insta{border-color:#E1306C}.card.fb{border-color:#1877F2}.card.li{border-color:#0A66C2}.card.music{border-color:#10b981}.card.bday{border-color:#8b5cf6}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#0f172a;color:#fff;font-weight:700;cursor:pointer}
#status{max-width:1150px;margin:10px auto;background:#dcfce7;padding:12px;border-radius:8px;display:none;text-align:center;color:#166534;font-weight:bold}
canvas{width:100%;border-radius:10px;background:#020617;margin-top:10px}
footer{background:#020617;color:#888;text-align:center;padding:20px;margin-top:20px}footer b{color:#fff}
</style>
</head>
<body>
<header><div class="logo">STH <span>Social Tools Hub</span></div><div style="font-size:11px;color:#10b981">● NO ADS DIRECT</div></header>
<div class="hero"><h2>Direct Download <span style="color:#38bdf8">No Ads, No WPS</span></h2><p>YouTube • Insta • TikTok • FB • LinkedIn • MP3 - 100% Direct</p></div>
<div id="status"></div>

<div class="grid">
<div class="card yt"><h3><i class="fa-brands fa-youtube" style="color:red"></i> YouTube</h3><input id="yt" placeholder="YouTube link yahan paste karo"><button style="background:red" onclick="directDownload('yt','mp4')">⬇️ Direct Download Video</button></div>
<div class="card insta"><h3><i class="fa-brands fa-instagram" style="color:#E1306C"></i> Instagram</h3><input id="insta" placeholder="Instagram Reels link"><button style="background:#E1306C" onclick="directDownload('insta','mp4')">⬇️ Direct Download</button></div>
<div class="card"><h3><i class="fa-brands fa-tiktok"></i> TikTok</h3><input id="tik" placeholder="TikTok link"><button style="background:#000" onclick="directDownload('tik','mp4')">⬇️ No Watermark</button></div>
<div class="card fb"><h3><i class="fa-brands fa-facebook" style="color:#1877F2"></i> Facebook</h3><input id="fb" placeholder="Facebook link"><button style="background:#1877F2" onclick="directDownload('fb','mp4')">⬇️ Direct Download</button></div>
<div class="card li"><h3><i class="fa-brands fa-linkedin" style="color:#0A66C2"></i> LinkedIn</h3><input id="li" placeholder="LinkedIn video link"><button style="background:#0A66C2" onclick="directDownload('li','mp4')">⬇️ Direct Download</button></div>
<div class="card"><h3><i class="fa-brands fa-x-twitter"></i> Twitter / X</h3><input id="x" placeholder="Twitter link"><button style="background:#000" onclick="directDownload('x','mp4')">⬇️ Download</button></div>
<div class="card music"><h3><i class="fa-solid fa-music" style="color:#10b981"></i> YouTube to MP3</h3><input id="mp3" placeholder="YouTube gana link"><button style="background:#10b981" onclick="directDownload('mp3','mp3')">🎵 Direct MP3 Download</button></div>
<div class="card bday" style="grid-column:span 2"><h3><i class="fa-solid fa-cake-candles" style="color:#8b5cf6"></i> Birthday Card</h3><input id="bName" placeholder="Name" oninput="makeCard()"><select id="bRel" onchange="makeCard()"><option>Friend</option><option>Brother</option><option>Sister</option><option>Everyone</option></select><canvas id="c" width="800" height="400"></canvas><button style="background:#8b5cf6" onclick="makeCard()">Make Card</button><button style="background:#10b981;margin-top:5px" onclick="saveCard()">Download PNG</button></div>
</div>
<footer>Developed by <b>SamranJaved</b> - No Ads Version</footer>

<script>
async function directDownload(id, type){
 let url = document.getElementById(id).value.trim();
 if(!url){alert('Link paste karo bhai!');return;}
 let status = document.getElementById('status');
 status.style.display='block';
 status.innerHTML='⏳ Direct link nikal raha hun... 5 second ruko, ab WPS wala ad nahi ayega!';

 try{
   // Method 1: Cobalt API (Best - No Ads)
   let r = await fetch('https://api.cobalt.tools/api/json', {
     method:'POST',
     headers:{'Accept':'application/json','Content-Type':'application/json'},
     body: JSON.stringify({url:url, vCodec:'h264', vQuality:'720', aFormat: type==='mp3'?'mp3':'best', isAudioOnly: type==='mp3'})
   });
   let j = await r.json();
   if(j.url){
     status.innerHTML='✅ Direct Link Mil Gaya! Download Start Ho Raha Hai...';
     window.location.href = j.url; // Direct download
     setTimeout(()=>{status.style.display='none';}, 3000);
     return;
   }
   throw 0;
 }catch(e){
   // Method 2: Backup - Loader.to (Ye bhi direct hai, WPS ad nahi)
   status.innerHTML='⚠️ Backup server use kar raha hun...';
   let f = (type==='mp3'?'mp3':'mp4');
   window.open('https://loader.to/api/button/?url='+encodeURIComponent(url)+'&f='+f+'&color=0f172a', '_blank');
   status.innerHTML='✅ Backup khul gaya - Wahan se Download dabao, WPS ad nahi ayega!';
   setTimeout(()=>{status.style.display='none';}, 4000);
 }
}
function makeCard(){let n=document.getElementById('bName').value||'Samran';let r=document.getElementById('bRel').value;let cv=document.getElementById('c');let x=cv.getContext('2d');x.fillStyle='#020617';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#38bdf8';x.font='bold 32px Arial';x.textAlign='center';x.fillText('Happy Birthday '+n,cv.width/2,200);x.fillStyle='#fff';x.font='20px Arial';x.fillText('My Dearest '+r,cv.width/2,250);}
function saveCard(){let cv=document.getElementById('c');let a=document.createElement('a');a.download='birthday.png';a.href=cv.toDataURL();a.click();}
makeCard();
</script>
</body>
</html>
